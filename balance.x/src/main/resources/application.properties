# H2 Database Konfiqurasiyas?
spring.datasource.url=jdbc:h2:mem:balance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA v? Hibernate Konfiqurasiyas?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Server Konfiqurasiyas?
server.port=8080

# JPA Open-In-View
spring.jpa.open-in-view=false

# Spring Security (?sas t?hlük?sizlik)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.basic.enabled=true

# Allow circular references in Spring beans (?g?r ehtiyac varsa)
spring.main.allow-circular-references=true

# Swagger Konfiqurasiyas?
springfox.documentation.enabled=true
