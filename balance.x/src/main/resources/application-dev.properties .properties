# H2 Database Konfiqurasiyas?
spring.datasource.url=jdbc:h2:mem:balance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Konfiqurasiyas? (?nki?af)
server.port=8081

# Spring Security (?nki?af)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.basic.enabled=false  # ?nki?af mühitind? t?hlük?sizlik deaktiv edilir
