# H2 Database Konfiqurasiyas?
spring.datasource.url=jdbc:h2:mem:balance_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080

# JPA v? Hibernate Konfiqurasiyas?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Performans v? Dair?vi Ba??ml?l?qlar
spring.main.allow-circular-references=true
spring.jpa.open-in-view=false

# G?lir v? X?rcl?rin ?dar? Edilm?si il? Ba?l? Xüsusi Konfiqurasiya
# G?lir v? X?rcl?r üçün ?n yüks?k limitl?r
balance.expense.limit=100000
balance.income.limit=500000

# Hesabatlar üçün tarix format?
balance.report.date-format=yyyy-MM-dd

# T?tbiq üçün audit log aktiv edilm?si
balance.audit-log.enabled=true

# Limitl?r
balance.expense-limit=1000.00  # X?rc limiti
balance.income-limit=5000.00  # G?lir limiti

